<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yorkville Explorer</title>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #111;
            user-select: none; -webkit-user-select: none; touch-action: none;
        }
        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        #car-container {
            position: absolute;
            top: 50%; left: 50%;
            width: 60px; height: 100px;
            transform: translate(-50%, -50%) rotate(0deg) scale(1);
            pointer-events: none;
            z-index: 10;
            transform-origin: center center;
        }
        .explorer-body {
            position: absolute; width: 48px; height: 90px; left: 6px; top: 5px;
            background: linear-gradient(135deg, #1b365d, #0d1b2a);
            border-radius: 14px 14px 10px 10px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.3);
            border: 2px solid #081018;
        }
        .explorer-roof {
            position: absolute; width: 36px; height: 44px; left: 6px; top: 22px;
            background: #111; border-radius: 6px; border: 1px solid #333;
        }
        .windshield {
            position: absolute; width: 32px; height: 14px; left: 2px; top: 4px;
            background: linear-gradient(to bottom, #7ec8e3, #2a6f97); border-radius: 3px 3px 1px 1px;
        }
        .rear-window {
            position: absolute; width: 32px; height: 12px; left: 2px; top: 28px;
            background: linear-gradient(to top, #7ec8e3, #2a6f97); border-radius: 1px 1px 3px 3px;
        }
        .wheel { position: absolute; width: 10px; height: 22px; background: #111; border-radius: 3px; border: 1px solid #444; }
        .wheel-fl { top: 12px; left: -2px; } .wheel-fr { top: 12px; right: -2px; }
        .wheel-rl { top: 62px; left: -2px; } .wheel-rr { top: 62px; right: -2px; }
        .headlight {
            position: absolute; width: 8px; height: 4px; background: #fff; top: 3px; border-radius: 2px;
            box-shadow: 0 0 6px #fff, 0 0 12px #ffff00;
        }
        .hl-left { left: 4px; } .hl-right { right: 4px; }
        .taillight {
            position: absolute; width: 8px; height: 3px; background: #ff2222; bottom: 3px; border-radius: 1px;
            box-shadow: 0 0 4px #ff0000;
        }
        .tl-left { left: 6px; } .tl-right { right: 6px; }

        #hud {
            position: absolute; top: 15px; left: 15px;
            max-width: 220px;
            background: rgba(15, 23, 42, 0.85); color: white; padding: 10px 14px;
            border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.1);
            z-index: 100; pointer-events: none;
        }
        #hud h1 { margin: 0 0 3px 0; font-size: 14px; color: #38bdf8; }
        #hud p { margin: 2px 0; font-size: 11px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        #minimap-container {
            position: absolute; top: 15px; right: 15px;
            width: 110px; height: 110px; border-radius: 50%;
            overflow: hidden; border: 3px solid #38bdf8;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6); z-index: 100;
            background: #0f172a; pointer-events: none;
        }
        #minimap { width: 100%; height: 100%; }

        #zoom-controls {
            position: absolute; top: 135px; right: 15px;
            display: flex; flex-direction: column; gap: 6px; z-index: 100;
        }
        .zoom-btn {
            width: 36px; height: 36px; background: rgba(15, 23, 42, 0.9);
            border: 2px solid #38bdf8; border-radius: 50%; color: white;
            font-size: 18px; font-weight: bold; display: flex; align-items: center;
            justify-content: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            user-select: none; transition: transform 0.05s, background 0.1s;
        }
        .zoom-btn:active { transform: scale(0.9); background: rgba(56, 189, 248, 0.4); }

        #touch-controls {
            position: absolute; bottom: 15px; left: 0; right: 0;
            display: flex; justify-content: space-between; padding: 0 15px;
            z-index: 100; pointer-events: none;
        }
        .control-group { display: flex; gap: 10px; pointer-events: auto; }
        .touch-btn {
            width: 65px; height: 65px;
            border-radius: 50%; color: white; font-size: 16px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4); cursor: pointer;
            user-select: none; -webkit-user-select: none;
            transition: transform 0.05s;
        }
        .touch-btn:active { transform: scale(0.92); }
        .btn-steer { background: rgba(15, 23, 42, 0.85); border: 2px solid rgba(56, 189, 248, 0.6); }
        .btn-steer:active { background: rgba(56, 189, 248, 0.3); }
        #btn-gas { background: rgba(22, 101, 52, 0.9); border: 2px solid #22c55e; }
        #btn-gas:active { background: rgba(34, 197, 94, 0.5); }
        #btn-brake { background: rgba(127, 29, 29, 0.9); border: 2px solid #ef4444; }
        #btn-brake:active { background: rgba(239, 68, 68, 0.5); }

        @media (max-height: 500px) {
            #hud { max-width: 170px; padding: 6px 10px; top: 10px; left: 10px; }
            #hud h1 { font-size: 12px; }
            #hud p { font-size: 9px; }
            #minimap-container { width: 75px; height: 75px; top: 10px; right: 10px; border-width: 2px; }
            #zoom-controls { top: 90px; right: 10px; gap: 4px; }
            .zoom-btn { width: 30px; height: 30px; font-size: 14px; }
            .touch-btn { width: 55px; height: 55px; font-size: 14px; }
            #touch-controls { bottom: 10px; padding: 0 10px; }
        }
    </style>
</head>
<body>

    <div id="map"></div>
    <div id="minimap-container"><div id="minimap"></div></div>

    <div id="zoom-controls">
        <div class="zoom-btn" id="btn-zoom-in">+</div>
        <div class="zoom-btn" id="btn-zoom-out">-</div>
    </div>

    <div id="hud">
        <h1>YORKVILLE EXPLORER</h1>
        <p>Vehicle: <strong>Ford Explorer</strong></p>
        <p>Speed: <span id="speed-display">0</span> MPH</p>
        <p>Location: <span id="location-display">Downtown Yorkville</span></p>
        <p>Area: <span id="area-display">Yorkville, Kendall County</span></p>
    </div>

    <div id="touch-controls">
        <div class="control-group">
            <div class="touch-btn btn-steer" id="btn-left">◀</div>
            <div class="touch-btn btn-steer" id="btn-right">▶</div>
        </div>
        <div class="control-group">
            <div class="touch-btn" id="btn-brake">REV</div>
            <div class="touch-btn" id="btn-gas">GAS</div>
        </div>
    </div>

    <div id="car-container">
        <div class="explorer-body">
            <div class="headlight hl-left"></div>
            <div class="headlight hl-right"></div>
            <div class="taillight tl-left" id="tl-left"></div>
            <div class="taillight tl-right" id="tl-right"></div>
            <div class="explorer-roof">
                <div class="windshield"></div>
                <div class="rear-window"></div>
            </div>
        </div>
        <div class="wheel wheel-fl"></div>
        <div class="wheel wheel-fr"></div>
        <div class="wheel wheel-rl"></div>
        <div class="wheel wheel-rr"></div>
    </div>

    <script>
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/liberty',
            center: [-88.4485, 41.6425],
            zoom: 17.5,
            pitch: 0,
            bearing: 0,
            interactive: true,
            scrollZoom: true,
            boxZoom: true,
            dragRotate: true,
            dragPan: true,
            keyboard: true,
            doubleClickZoom: true,
            touchZoomRotate: true
        });

        const miniMap = new maplibregl.Map({
            container: 'minimap',
            style: 'https://tiles.openfreemap.org/styles/liberty',
            center: [-88.4485, 41.6425],
            zoom: 13,
            interactive: false,
            attributionControl: false
        });

        let zoomInterval = null;
        function startContinuousZoom(delta) {
            if (zoomInterval) clearInterval(zoomInterval);
            zoomInterval = setInterval(() => {
                const currentZoom = map.getZoom();
                map.setZoom(currentZoom + delta);
            }, 50);
        }
        function stopContinuousZoom() {
            if (zoomInterval) {
                clearInterval(zoomInterval);
                zoomInterval = null;
            }
        }
        const btnZoomIn = document.getElementById('btn-zoom-in');
        const btnZoomOut = document.getElementById('btn-zoom-out');
        btnZoomIn.addEventListener('mousedown', () => startContinuousZoom(0.15));
        btnZoomIn.addEventListener('touchstart', (e) => { e.preventDefault(); startContinuousZoom(0.15); });
        btnZoomOut.addEventListener('mousedown', () => startContinuousZoom(-0.15));
        btnZoomOut.addEventListener('touchstart', (e) => { e.preventDefault(); startContinuousZoom(-0.15); });
        window.addEventListener('mouseup', stopContinuousZoom);
        window.addEventListener('touchend', stopContinuousZoom);
        window.addEventListener('touchcancel', stopContinuousZoom);

        let car = { lng: -88.4485, lat: 41.6425, speed: 0, baseMaxSpeed: 0.00002, acceleration: 0.0000008, friction: 0.94, angle: 0, turnSpeed: 3.2 };
        const keys = { W: false, A: false, S: false, D: false };

        window.addEventListener('keydown', (e) => {
            if (['w', 'W', 'ArrowUp'].includes(e.key)) keys.W = true;
            if (['a', 'A', 'ArrowLeft'].includes(e.key)) keys.A = true;
            if (['s', 'S', 'ArrowDown'].includes(e.key)) keys.S = true;
            if (['d', 'D', 'ArrowRight'].includes(e.key)) keys.D = true;
        });
        window.addEventListener('keyup', (e) => {
            if (['w', 'W', 'ArrowUp'].includes(e.key)) keys.W = false;
            if (['a', 'A', 'ArrowLeft'].includes(e.key)) keys.A = false;
            if (['s', 'S', 'ArrowDown'].includes(e.key)) keys.S = false;
            if (['d', 'D', 'ArrowRight'].includes(e.key)) keys.D = false;
        });

        function bindTouch(id, keyName) {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
            el.addEventListener('mousedown', () => { keys[keyName] = true; });
            el.addEventListener('mouseup', () => { keys[keyName] = false; });
            el.addEventListener('mouseleave', () => { keys[keyName] = false; });
        }
        bindTouch('btn-left', 'A');
        bindTouch('btn-right', 'D');
        bindTouch('btn-gas', 'W');
        bindTouch('btn-brake', 'S');

        const carContainer = document.getElementById('car-container');

        function updateGame() {
            const currentZoom = map.getZoom();
            const zoomScale = Math.pow(2, 17.5 - currentZoom);
            const effectiveMaxSpeed = car.baseMaxSpeed * zoomScale;
            const effectiveAcc = car.acceleration * zoomScale;

            if (keys.A && Math.abs(car.speed) > 0.0000005) car.angle -= car.turnSpeed * (car.speed > 0 ? 1 : -1);
            if (keys.D && Math.abs(car.speed) > 0.0000005) car.angle += car.turnSpeed * (car.speed > 0 ? 1 : -1);

            if (keys.W) {
                car.speed += effectiveAcc;
                if (car.speed > effectiveMaxSpeed) car.speed = effectiveMaxSpeed;
                document.getElementById('tl-left').style.boxShadow = '0 0 4px #ff0000';
                document.getElementById('tl-right').style.boxShadow = '0 0 4px #ff0000';
            } else if (keys.S) {
                car.speed -= effectiveAcc;
                if (car.speed < -effectiveMaxSpeed / 2) car.speed = -effectiveMaxSpeed / 2;
                document.getElementById('tl-left').style.boxShadow = '0 0 10px #ff0000';
                document.getElementById('tl-right').style.boxShadow = '0 0 10px #ff0000';
            } else {
                car.speed *= car.friction;
                if (Math.abs(car.speed) < 0.00000002) car.speed = 0;
                document.getElementById('tl-left').style.boxShadow = '0 0 4px #ff0000';
                document.getElementById('tl-right').style.boxShadow = '0 0 4px #ff0000';
            }

            if (car.speed !== 0) {
                const rad = car.angle * (Math.PI / 180);
                car.lng += Math.sin(rad) * car.speed;
                car.lat += Math.cos(rad) * car.speed;
            }

            if (map.loaded()) map.jumpTo({ center: [car.lng, car.lat] });
            if (miniMap.loaded()) miniMap.jumpTo({ center: [car.lng, car.lat] });

            const zoomDiff = currentZoom - 17.5;
            const carScale = Math.max(0.4, Math.pow(1.15, zoomDiff));
            carContainer.style.transform = `translate(-50%, -50%) rotate(${car.angle}deg) scale(${carScale})`;

            const displayMph = Math.round(Math.abs(car.speed) / car.baseMaxSpeed * 25);
            document.getElementById('speed-display').innerText = displayMph;

            // UPDATED: FIELDS OF FARM COLONY STRICTLY SOUTH OF RT 71
            let locName = "";
            let cityName = "Yorkville";
            let countyName = "Kendall County";
            
            const clng = car.lng;
            const clat = car.lat;

            // 1. OSWEGO BORDERS (Strictly East of -88.380)
            if (clng > -88.380 && clat >= 41.640) {
                cityName = "Oswego";
                if (clng >= -88.365 && clng <= -88.340 && clat >= 41.675 && clat <= 41.690) {
                    locName = "Downtown Oswego";
                } else if (clng > -88.340 && clat >= 41.680) {
                    locName = "Churchill Club";
                } else if (clng >= -88.380 && clng <= -88.340 && clat >= 41.640 && clat < 41.675) {
                    locName = "Southbury";
                } else if (clat > 41.690) {
                    locName = "Farmington Lakes";
                }
            } 
            // 2. PLANO BORDERS (Strictly West of -88.485)
            else if (clng < -88.485) {
                cityName = "Plano";
                locName = "Plano City Limits";
            } 
            // 3. YORKVILLE BORDERS
            else {
                cityName = "Yorkville";
                
                // Downtown Yorkville (Center, Bridge St / Rt 47)
                if (clng >= -88.455 && clng <= -88.440 && clat >= 41.638 && clat <= 41.648) {
                    locName = "Downtown Yorkville / Riverfront";
                } 
                // Yorkville High School (Strictly West of Rt 47, Game Farm Rd)
                else if (clng >= -88.465 && clng < -88.445 && clat > 41.648 && clat <= 41.665) {
                    locName = "Yorkville High School Campus";
                } 
                // Grande Reserve & Bristol Bay (Northeast, North of Rt 34)
                else if (clng >= -88.445 && clng <= -88.380 && clat >= 41.655) {
                    locName = "Grande Reserve / Bristol Bay";
                } 
                // Fields of Farm Colony (East Yorkville, STRICTLY SOUTH of Rt 71, North of Raintree)
                else if (clng >= -88.410 && clng <= -88.380 && clat >= 41.628 && clat < 41.645) {
                    locName = "Fields of Farm Colony"; 
                } 
                // Fox Highlands / East Yorkville (Bridge between Downtown and Farm Colony)
                else if (clng >= -88.440 && clng < -88.410 && clat >= 41.638 && clat < 41.655) {
                    locName = "Fox Highlands / East Yorkville";
                }
                // Raintree Village (Strictly East of Windett, South of Farm Colony)
                else if (clng >= -88.428 && clng <= -88.380 && clat >= 41.600 && clat < 41.628) {
                    locName = "Raintree Village";
                } 
                // Windett Ridge (Strictly East of Rt 47, West of Raintree)
                else if (clng >= -88.446 && clng < -88.428 && clat >= 41.600 && clat < 41.630) {
                    locName = "Windett Ridge";
                } 
                // Country Hills (Strictly West of Rt 47, strictly South of Rt 71)
                else if (clng >= -88.480 && clng < -88.446 && clat >= 41.600 && clat <= 41.632) {
                    locName = "Country Hills";
                } 
            }

            // 4. DYNAMIC COMPASS FALLBACK FOR GAPS AND OUTER LIMITS
            if (locName === "") {
                let dLng = clng - (-88.446); // Centered on Rt 47 Bridge St
                let dLat = clat - 41.642;    // Centered on Downtown bridge
                
                let ns = "";
                let ew = "";
                
                if (dLat > 0.005) ns = "North";
                else if (dLat < -0.005) ns = "South";
                
                if (dLng > 0.008) ew = "East";
                else if (dLng < -0.008) ew = "West";
                
                let direction = ns + ew; 
                
                if (direction === "") direction = "Central";
                else if (direction === "NorthEast") direction = "Northeast";
                else if (direction === "SouthEast") direction = "Southeast";
                else if (direction === "NorthWest") direction = "Northwest";
                else if (direction === "SouthWest") direction = "Southwest";

                locName = `${direction} ${cityName} Local Roads`;
            }

            document.getElementById('location-display').innerText = locName;
            document.getElementById('area-display').innerText = `${cityName}, ${countyName}`;

            requestAnimationFrame(updateGame);
        }

        map.on('load', () => {
            requestAnimationFrame(updateGame);
        });
    </script>
</body>
</html>
