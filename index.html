<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yorkville Explorer - OpenStreetMap Edition</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #111;
            color: #fff;
        }
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background: #1a1a1a;
            z-index: 1;
        }
        /* HUD / Dashboard Overlay */
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 18px;
            border-radius: 12px;
            pointer-events: none;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .hud-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #ff9f43;
            margin-bottom: 4px;
            font-weight: 700;
        }
        .hud-row {
            font-size: 15px;
            font-weight: 600;
            margin: 2px 0;
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }
        .hud-value {
            font-family: monospace;
            color: #00d2d3;
        }

        /* Minimap Overlay */
        #minimap-container {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            background: #222;
            pointer-events: none;
        }
        #minimap {
            width: 100%;
            height: 100%;
            background: #111;
        }

        /* Controls / Touch D-Pad */
        .controls-container {
            position: absolute;
            bottom: 25px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 25px;
            z-index: 10;
            pointer-events: none;
        }
        .control-group {
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }
        .control-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(5px);
            color: white;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            transition: background 0.1s, transform 0.1s;
        }
        .control-btn:active, .control-btn.active {
            background: rgba(255, 159, 67, 0.5);
            border-color: #ff9f43;
            transform: scale(0.92);
        }
        .pedal-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: auto;
        }
        .pedal-btn {
            width: 75px;
            height: 55px;
            border-radius: 16px;
            background: rgba(0, 210, 211, 0.2);
            border: 2px solid rgba(0, 210, 211, 0.4);
            backdrop-filter: blur(5px);
            color: white;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            transition: background 0.1s, transform 0.1s;
        }
        .pedal-btn:active, .pedal-btn.active {
            background: rgba(0, 210, 211, 0.6);
            border-color: #00d2d3;
            transform: scale(0.92);
        }
        .pedal-btn.brake {
            background: rgba(255, 71, 87, 0.2);
            border-color: rgba(255, 71, 87, 0.4);
        }
        .pedal-btn.brake:active, .pedal-btn.brake.active {
            background: rgba(255, 71, 87, 0.6);
            border-color: #ff4757;
        }

        /* Custom Leaflet Vehicle Marker */
        .vehicle-marker {
            background: none;
            border: none;
        }
        .vehicle-icon {
            width: 44px;
            height: 44px;
            background: #ff9f43;
            border: 3px solid #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(255, 159, 67, 0.8);
            font-size: 20px;
            transition: transform 0.05s linear;
        }
    </style>
</head>
<body>

    <div id="hud">
        <div class="hud-title">Ford Explorer • Kendall Co.</div>
        <div class="hud-row"><span>Speed</span><span id="speed-val" class="hud-value">0 MPH</span></div>
        <div class="hud-row"><span>Heading</span><span id="heading-val" class="hud-value">0°</span></div>
    </div>

    <div id="minimap-container">
        <div id="minimap"></div>
    </div>

    <div id="map"></div>

    <div class="controls-container">
        <div class="control-group">
            <button class="control-btn" id="btn-left">◀</button>
            <button class="control-btn" id="btn-right">▶</button>
        </div>
        <div class="pedal-group">
            <button class="pedal-btn" id="btn-accel">Drive</button>
            <button class="pedal-btn brake" id="btn-brake">Brake</button>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        // Initialize Main Map centered on Yorkville / Oswego area
        const defaultLat = 41.6447;
        const defaultLng = -88.4456;

        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false,
            dragging: false,
            touchZoom: true,
            scrollWheelZoom: true,
            doubleClickZoom: false
        }).setView([defaultLat, defaultLng], 15);

        // Dark Matter CartoDB Tile Layer for Clean OpenStreetMap rendering
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            subdomains: 'abcd'
        }).addTo(map);

        // Initialize Mini Map
        const minimap = L.map('minimap', {
            zoomControl: false,
            attributionControl: false,
            dragging: false,
            touchZoom: false,
            scrollWheelZoom: false,
            doubleClickZoom: false
        }).setView([defaultLat, defaultLng], 13);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            subdomains: 'abcd'
        }).addTo(minimap);

        // Vehicle State & Physics
        let carPos = { lat: defaultLat, lng: defaultLng };
        let heading = 0; // degrees
        let speed = 0; // current velocity magnitude
        const maxSpeed = 0.00015; // scaled lat/lng delta per frame
        const acceleration = 0.000005;
        const deceleration = 0.000008;
        const turnSpeed = 3.5; // degrees per frame

        // Input Tracking flags
        const inputs = { left: false, right: false, accel: false, brake: false };

        // Custom Vehicle Icon
        const vehicleIconHtml = L.divIcon({
            className: 'vehicle-marker',
            html: '<div id="car-icon-inner" class="vehicle-icon">🚙</div>',
            iconSize: [44, 44],
            iconAnchor: [22, 22]
        });

        const vehicleMarker = L.marker([defaultLat, defaultLng], { icon: vehicleIconHtml }).addTo(map);
        const minimapMarker = L.marker([defaultLat, defaultLng], { 
            icon: L.divIcon({ className: 'vehicle-marker', html: '<div style="font-size:12px;">🔴</div>', iconSize: [12,12], iconAnchor: [6,6] }) 
        }).addTo(minimap);

        // UI Element References
        const speedValEl = document.getElementById('speed-val');
        const headingValEl = document.getElementById('heading-val');
        const carIconInner = document.getElementById('car-icon-inner');

        // Input Event Listeners
        function bindButton(id, inputKey) {
            const el = document.getElementById(id);
            if (!el) return;
            const activate = (e) => { e.preventDefault(); inputs[inputKey] = true; el.classList.add('active'); };
            const deactivate = (e) => { e.preventDefault(); inputs[inputKey] = false; el.classList.remove('active'); };

            el.addEventListener('mousedown', activate);
            el.addEventListener('mouseup', deactivate);
            el.addEventListener('mouseleave', deactivate);
            el.addEventListener('touchstart', activate, {passive: false});
            el.addEventListener('touchend', deactivate, {passive: false});
            el.addEventListener('touchcancel', deactivate, {passive: false});
        }

        bindButton('btn-left', 'left');
        bindButton('btn-right', 'right');
        bindButton('btn-accel', 'accel');
        bindButton('btn-brake', 'brake');

        // Keyboard Controls support
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') inputs.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') inputs.right = true;
            if (e.key === 'ArrowUp' || e.key === 'w') inputs.accel = true;
            if (e.key === 'ArrowDown' || e.key === 's') inputs.brake = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') inputs.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') inputs.right = false;
            if (e.key === 'ArrowUp' || e.key === 'w') inputs.accel = false;
            if (e.key === 'ArrowDown' || e.key === 's') inputs.brake = false;
        });

        // Main Game Loop
        function updatePhysics() {
            // Steering
            if (inputs.left) heading = (heading - turnSpeed + 360) % 360;
            if (inputs.right) heading = (heading + turnSpeed) % 360;

            // Acceleration & Braking
            if (inputs.accel) {
                speed = Math.min(speed + acceleration, maxSpeed);
            } else if (inputs.brake) {
                speed = Math.max(speed - (deceleration * 1.5), 0);
            } else {
                speed = Math.max(speed - deceleration, 0);
            }

            // Calculate movement vector based on heading and current zoom scale
            if (speed > 0) {
                const rad = heading * (Math.PI / 180);
                const zoomFactor = Math.pow(2, 15 - map.getZoom()); // Dynamic scale relative to zoom
                const currentSpeedScaled = speed * Math.max(0.2, zoomFactor);

                carPos.lat += Math.cos(rad) * currentSpeedScaled;
                carPos.lng += Math.sin(rad) * (currentSpeedScaled / Math.cos(carPos.lat * Math.PI / 180));
            }

            // Update Markers and Map View
            vehicleMarker.setLatLng([carPos.lat, carPos.lng]);
            minimapMarker.setLatLng([carPos.lat, carPos.lng]);
            map.setView([carPos.lat, carPos.lng], map.getZoom(), { animate: false });
            minimap.setView([carPos.lat, carPos.lng], 13, { animate: false });

            // Rotate Car Icon visually
            if (carIconInner) {
                carIconInner.style.transform = `rotate(${heading}deg)`;
            }

            // Update HUD
            const displaySpeed = Math.round((speed / maxSpeed) * 65);
            speedValEl.innerText = `${displaySpeed} MPH`;
            headingValEl.innerText = `${Math.round(heading)}°`;

            requestAnimationFrame(updatePhysics);
        }

        requestAnimationFrame(updatePhysics);
    </script>
</body>
</html>
